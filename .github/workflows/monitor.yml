name: SBSSU Notice Monitor

on:
  schedule:
    - cron: "35 2 * * *"

  workflow_dispatch:
  
permissions:
  contents: write

concurrency:
  group: sbssu-notice-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------
      # Run Python monitor
      # ---------------------------------------------------

      - name: Run SBSSU Notice Monitor
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python monitor.py

      # ---------------------------------------------------
      # Save updated state.json
      # ---------------------------------------------------

      - name: Check for state changes
        id: state
        run: |
          if git diff --quiet -- state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------
      # Commit updated state
      # ---------------------------------------------------

      - name: Commit updated state
        if: steps.state.outputs.changed == 'true'
        run: |
          git config user.name "SBSSU Notice Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          git commit -m "Update SBSSU notice monitor state"

          git push